[project]
name = "haicas-tutor"
version = "0.1.0"
description = "A beginner learning companion for responsible human-AI co-assistance."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.61.1",
    "transformers>=4.49.0",
    "torch>=2.6.0",
    "accelerate>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
